services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meantime
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meantime"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  # S3-compatible object storage for task proofs. MinIO's community images are
  # no longer published (docker.io/minio/minio returns "repository does not
  # exist" and quay.io/minio/minio answers 401), so the local stack uses Adobe's
  # S3 mock. It implements the subset the API needs: an initial bucket,
  # PutObject, HeadObject, and presigned GET/PUT. The API talks path-style S3,
  # so pointing S3_ENDPOINT at http://localhost:9000 requires no code change.
  s3mock:
    image: adobe/s3mock:latest
    environment:
      # Created on boot, matching S3_BUCKET in apps/api/.env.
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: meantime
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: us-east-1
    ports:
      # The container listens on 9090; 9000 keeps the documented S3_ENDPOINT.
      - "9000:9090"
    # No healthcheck: the image ships no shell or HTTP client, and a probe that
    # cannot run would report the service unhealthy while it is serving fine.
    # The bucket is created on boot, and the API surfaces storage failures as
    # `proof_storage_unavailable`.

  # Real Laya inference server: TypeSafe Jev-compatible POST /v1/systemone.
  # Built from the pinned upstream tag. The first build is large (PyTorch CPU)
  # and the first run downloads the English checkpoint (~400MB) into the volume.
  laya:
    build:
      context: https://github.com/NandhaKishorM/laya.git#v0.4.21
      args:
        TORCH_INDEX: cpu
        TORCH_VERSION: "2.14.0"
    command: ["laya-serve"]
    environment:
      LAYA_HOST: "0.0.0.0"
      LAYA_PORT: "8000"
      LAYA_DEVICE: "cpu"
      # Preload both checkpoints so neither the first ad nor the first
      # non-English request pays a lazy load cost and time out into
      # needs_review. `multilingual` serves detected non-English states;
      # undecided short task states fall back to English for latency.
      LAYA_PRELOAD: "1"
      LAYA_MODELS: "english,multilingual"
      LAYA_DEFAULT_MODEL: "english"
      OMP_NUM_THREADS: "4"
    ports:
      # Loopback only: `laya-serve` has no API key unless LAYA_API_KEY is set.
      - "127.0.0.1:8000:8000"
    volumes:
      - laya-models:/home/laya/.cache/huggingface
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['LAYA_PORT']+'/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10m
    restart: unless-stopped

  # Fast, offline test double that speaks the same /v1/systemone protocol.
  # Use it with `docker compose --profile stub up -d` and
  # LAYA_ENDPOINT=http://localhost:8080. Never treat its scores as model output.
  laya-stub:
    profiles: ["stub"]
    build: ./infra/laya-stub
    ports:
      - "8080:8080"
    healthcheck:
      # 127.0.0.1, not localhost: Alpine resolves localhost to ::1 first and
      # the stub binds IPv4 only, which made every probe fail.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  laya-models:
